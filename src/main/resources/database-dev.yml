spring:
  datasource:
#    url: jdbc:mysql://localhost:3307/my_blog_api
    url: jdbc:mysql://mysql-outside-use:3306/my_blog_api
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 1800000
      min-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
      #create, update, create-update, validate
      generate_statics: false
      jdbc:
        batch_size: 100
      order-inserts: true
    show-sql: true

pool:
  name: blog_app_pool